services:
  frontend-dev:
    image: node:22-alpine
    profiles:
      - frontend-dev
    working_dir: /workspace
    command:
      ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules

  node:
    image: node:22-alpine
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: ["sh", "-c", "npm ci && npm run build"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      FCT_DB_HOST: db
      FCT_DB_NAME: ${FCT_DB_NAME:-sistema_fct}
      FCT_DB_USER: ${FCT_DB_USER:-fct}
      FCT_DB_PASS: ${FCT_DB_PASS:-fct_local_dev}
      FCT_STORAGE_PATH: /var/lib/fct/storage
      FCT_CLAMAV_ENABLED: ${FCT_CLAMAV_ENABLED:-true}
      FCT_CLAMD_HOST: clamav
      FCT_CLAMD_PORT: 3310
      FCT_VITE_DEV_SERVER: ${FCT_VITE_DEV_SERVER:-}
      FCT_WEBHOOK_INBOUND_SECRET: ${FCT_WEBHOOK_INBOUND_SECRET:-}
      FCT_WEBHOOK_OUTBOUND_URL: ${FCT_WEBHOOK_OUTBOUND_URL:-}
      FCT_WEBHOOK_OUTBOUND_SECRET: ${FCT_WEBHOOK_OUTBOUND_SECRET:-}
      FCT_PUBLIC_BASE_URL: ${FCT_PUBLIC_BASE_URL:-}
      FCT_MAIL_FROM: ${FCT_MAIL_FROM:-}
      FCT_MAIL_HOST: ${FCT_MAIL_HOST:-mailpit}
      FCT_MAIL_PORT: ${FCT_MAIL_PORT:-1025}
      FCT_MAIL_USERNAME: ${FCT_MAIL_USERNAME:-}
      FCT_MAIL_PASSWORD: ${FCT_MAIL_PASSWORD:-}
      FCT_MAIL_ENCRYPTION: ${FCT_MAIL_ENCRYPTION:-none}
      FCT_RESET_RATE_LIMIT_KEY: ${FCT_RESET_RATE_LIMIT_KEY:-${FCT_DB_PASS:-fct_local_dev}}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - fct_storage:/var/lib/fct/storage
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s = @fsockopen('127.0.0.1', 80); if (!$$s) exit(1); fclose($$s);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: mariadb:10.4.32
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: ${FCT_DB_NAME:-sistema_fct}
      MARIADB_USER: ${FCT_DB_USER:-fct}
      MARIADB_PASSWORD: ${FCT_DB_PASS:-fct_local_dev}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_local_dev}
    volumes:
      - db_data:/var/lib/mysql
      # MariaDB importa el esquema base; la aplicación aplica y registra migraciones.
      - ./database/sistema_fct.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/001_renombrar_nombre_especialidad.sql:/docker-entrypoint-initdb.d/002-migration.sql:ro
      - ./database/migrations/002_fct_workflows.sql:/docker-entrypoint-initdb.d/003-migration.sql:ro
      - ./database/migrations/003_login_y_recuperacion.sql:/docker-entrypoint-initdb.d/004-migration.sql:ro
      - ./database/migrations/004_convenios_por_especialidad.sql:/docker-entrypoint-initdb.d/005-migration.sql:ro
      - ./database/migrations/005_horarios_y_calificaciones.sql:/docker-entrypoint-initdb.d/006-migration.sql:ro
      - ./database/migrations/006_alumno_codigo_postal.sql:/docker-entrypoint-initdb.d/007-migration.sql:ro
      - ./database/migrations/007_horarios_ofertas.sql:/docker-entrypoint-initdb.d/008-migration.sql:ro
      - ./database/migrations/008_disponibilidad_indiferente.sql:/docker-entrypoint-initdb.d/009-migration.sql:ro
      - ./database/migrations/009_desarrollo_aplicaciones_multiplataforma.sql:/docker-entrypoint-initdb.d/010-migration.sql:ro
      - ./database/migrations/010_detalles_ofertas.sql:/docker-entrypoint-initdb.d/011-migration.sql:ro
      - ./database/migrations/007_webhooks.sql:/docker-entrypoint-initdb.d/012-webhooks.sql:ro
      - ./database/migrations/008_api_access_tokens.sql:/docker-entrypoint-initdb.d/013-api-access-tokens.sql:ro
      - ./database/migrations/009_webhook_responses.sql:/docker-entrypoint-initdb.d/014-webhook-responses.sql:ro
      - ./database/migrations/012_jornada_ofertas.sql:/docker-entrypoint-initdb.d/015-jornada-ofertas.sql:ro
      - ./database/migrations/015_solicitudes_reset_password.sql:/docker-entrypoint-initdb.d/016-reset-password.sql:ro
      - ./database/migrations/016_audit_logs_aprobacion_empresas.sql:/docker-entrypoint-initdb.d/017-audit-logs.sql:ro
      - ./database/migrations/017_password_reset_hardening.sql:/docker-entrypoint-initdb.d/018-password-reset-hardening.sql:ro
      - ./database/migrations/018_estado_pendiente_aprobacion_reset.sql:/docker-entrypoint-initdb.d/019-password-reset-pending-status.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(mariadb --protocol=TCP --host=127.0.0.1
          --user="$${MARIADB_USER}" --password="$${MARIADB_PASSWORD}"
          "$${MARIADB_DATABASE}" --batch --skip-column-names
          --execute="SELECT 1" 2>/dev/null)" = "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:${PMA_PORT:-8082}:80"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4
    environment:
      TZ: UTC
      CLAMD_CONF_TCPAddr: 0.0.0.0
      CLAMD_CONF_TCPSocket: 3310
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1:1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30m
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    profiles:
      - dev
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    restart: unless-stopped

volumes:
  db_data:
  clamav_db:
  fct_storage:
  node_modules:
  frontend_node_modules:
