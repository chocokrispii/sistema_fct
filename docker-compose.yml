services:
  frontend-dev:
    image: node:22-alpine
    profiles:
      - frontend-dev
    working_dir: /workspace
    command:
      ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"]
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules

  node:
    image: node:22-alpine
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: ["sh", "-c", "npm ci && npm run build"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-production}
      FCT_DB_HOST: db
      FCT_DB_NAME: ${FCT_DB_NAME:-sistema_fct}
      FCT_DB_USER: ${FCT_DB_USER:-fct}
      FCT_DB_PASS: ${FCT_DB_PASS:-fct_local_dev}
      FCT_STORAGE_PATH: /var/lib/fct/storage
      FCT_CLAMAV_ENABLED: ${FCT_CLAMAV_ENABLED:-true}
      FCT_CLAMD_HOST: clamav
      FCT_CLAMD_PORT: 3310
      FCT_VITE_DEV_SERVER: ${FCT_VITE_DEV_SERVER:-}
      FCT_APP_URL: ${FCT_APP_URL:-}
      FCT_MATCH_DATE_TOLERANCE_DAYS: ${FCT_MATCH_DATE_TOLERANCE_DAYS:-5}
      FCT_MATCH_MIN_OVERLAP_DAYS: ${FCT_MATCH_MIN_OVERLAP_DAYS:-1}
      FCT_MATCH_MIN_SCHEDULE_PERCENT: ${FCT_MATCH_MIN_SCHEDULE_PERCENT:-80}
      FCT_MAIL_HOST: ${FCT_MAIL_HOST:-smtp.gmail.com}
      FCT_MAIL_PORT: ${FCT_MAIL_PORT:-587}
      FCT_MAIL_ENCRYPTION: ${FCT_MAIL_ENCRYPTION:-tls}
      FCT_MAIL_TRANSPORT: ${FCT_MAIL_TRANSPORT:-smtp}
      FCT_MAIL_USERNAME: ${FCT_MAIL_USERNAME:-}
      FCT_MAIL_PASSWORD: ${FCT_MAIL_PASSWORD:-}
      FCT_MAIL_FROM: ${FCT_MAIL_FROM:-}
      FCT_MAIL_FROM_NAME: ${FCT_MAIL_FROM_NAME:-Sistema FCT}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - fct_storage:/var/lib/fct/storage
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s = @fsockopen('127.0.0.1', 80); if (!$$s) exit(1); fclose($$s);"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: mariadb:10.4.32
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_DATABASE: ${FCT_DB_NAME:-sistema_fct}
      MARIADB_USER: ${FCT_DB_USER:-fct}
      MARIADB_PASSWORD: ${FCT_DB_PASS:-fct_local_dev}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_local_dev}
    volumes:
      - db_data:/var/lib/mysql
      # MariaDB procesa estos archivos en orden al crear un volumen vacío.
      - ./database/sistema_fct.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/001_renombrar_nombre_especialidad.sql:/docker-entrypoint-initdb.d/002-migration.sql:ro
      - ./database/migrations/002_fct_workflows.sql:/docker-entrypoint-initdb.d/003-migration.sql:ro
      - ./database/migrations/003_login_y_recuperacion.sql:/docker-entrypoint-initdb.d/004-migration.sql:ro
      - ./database/migrations/004_convenios_por_especialidad.sql:/docker-entrypoint-initdb.d/005-migration.sql:ro
      - ./database/migrations/005_horarios_y_calificaciones.sql:/docker-entrypoint-initdb.d/006-migration.sql:ro
      - ./database/migrations/006_alumno_codigo_postal.sql:/docker-entrypoint-initdb.d/007-migration.sql:ro
      - ./database/migrations/007_horarios_ofertas.sql:/docker-entrypoint-initdb.d/008-migration.sql:ro
      - ./database/migrations/008_disponibilidad_indiferente.sql:/docker-entrypoint-initdb.d/009-migration.sql:ro
      - ./database/migrations/009_desarrollo_aplicaciones_multiplataforma.sql:/docker-entrypoint-initdb.d/010-migration.sql:ro
      - ./database/migrations/010_detalles_ofertas.sql:/docker-entrypoint-initdb.d/011-migration.sql:ro
      - ./database/migrations/008_api_access_tokens.sql:/docker-entrypoint-initdb.d/013-api-access-tokens.sql:ro
      - ./database/migrations/011_gestion_ciclos.sql:/docker-entrypoint-initdb.d/015-gestion-ciclos.sql:ro
      - ./database/migrations/012_alta_alumnos_personal.sql:/docker-entrypoint-initdb.d/016-alta-alumnos-personal.sql:ro
      - ./database/migrations/013_activacion_cuentas_alumno.sql:/docker-entrypoint-initdb.d/017-activacion-cuentas-alumno.sql:ro
      - ./database/migrations/014_identificador_fiscal_personal.sql:/docker-entrypoint-initdb.d/018-identificador-fiscal-personal.sql:ro
      - ./database/migrations/015_alta_personal_institucional.sql:/docker-entrypoint-initdb.d/019-alta-personal-institucional.sql:ro
      - ./database/migrations/016_solicitudes_reenvio_activacion.sql:/docker-entrypoint-initdb.d/020-solicitudes-reenvio-activacion.sql:ro
      - ./database/migrations/017_trazabilidad_administrativa.sql:/docker-entrypoint-initdb.d/021-trazabilidad-administrativa.sql:ro
      - ./database/migrations/018_tipo_documento_alumno.sql:/docker-entrypoint-initdb.d/022-tipo-documento-alumno.sql:ro
      - ./database/migrations/019_activacion_cuentas_empresa.sql:/docker-entrypoint-initdb.d/023-activacion-cuentas-empresa.sql:ro
      - ./database/migrations/020_alta_empresa_y_recuperacion_admin.sql:/docker-entrypoint-initdb.d/024-alta-empresa-recuperacion-admin.sql:ro
      - ./database/migrations/021_documentacion_cierre_alumno.sql:/docker-entrypoint-initdb.d/025-documentacion-cierre-alumno.sql:ro
      - ./database/migrations/022_documentacion_inicio_asignacion.sql:/docker-entrypoint-initdb.d/026-documentacion-inicio-asignacion.sql:ro
      - ./database/migrations/023_evaluacion_empresa.sql:/docker-entrypoint-initdb.d/027-evaluacion-empresa.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(mariadb --protocol=TCP --host=127.0.0.1
          --user="$${MARIADB_USER}" --password="$${MARIADB_PASSWORD}"
          "$${MARIADB_DATABASE}" --batch --skip-column-names
          --execute="SELECT IF(
          EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'alumnos'
          AND COLUMN_NAME = 'codigo_postal')
          AND EXISTS (SELECT 1 FROM information_schema.TABLES
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'calificaciones_fct')
          AND EXISTS (SELECT 1 FROM information_schema.TABLES
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'empresa_oferta_horarios_semanales')
          AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'alumno_disponibilidad'
          AND COLUMN_NAME = 'es_indiferente')
          AND EXISTS (SELECT 1 FROM information_schema.TABLES
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'especialidades')
          AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'empresa_especialidades_plazas'
          AND COLUMN_NAME = 'titulo')
          AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'empresa_especialidades_plazas'
          AND COLUMN_NAME = 'modalidad')
          AND EXISTS (SELECT 1 FROM information_schema.TABLES
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'api_access_tokens')
          AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'usuarios'
          AND COLUMN_NAME = 'identificador_fiscal')
          AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'alumnos'
          AND COLUMN_NAME = 'tipo_documento')
            AND EXISTS (SELECT 1 FROM information_schema.TABLES
           WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'documentacion_cierre_fct')
            AND EXISTS (SELECT 1 FROM information_schema.COLUMNS
           WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'asignaciones_fct' AND COLUMN_NAME = 'evaluacion_dictamen'), 1, 0)")" = "1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "127.0.0.1:${PMA_PORT:-8082}:80"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4
    environment:
      TZ: UTC
      CLAMD_CONF_TCPAddr: 0.0.0.0
      CLAMD_CONF_TCPSocket: 3310
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1:1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30m
    restart: unless-stopped

volumes:
  db_data:
  clamav_db:
  fct_storage:
  node_modules:
  frontend_node_modules:
